<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Puzzle - LOCKED/ACTIVE/SOLVED 🧮</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #020617, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
}
canvas {
    box-shadow: 0 0 100px #00f7ff66;
    cursor: grab;
}
canvas:active { cursor: grabbing; }
</style>
</head>

<body>
<canvas id="c" width="700" height="700"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const LOCKED = 0;   // رمادي - لا drag
const ACTIVE = 1;   // أزرق - drag مسموح
const SOLVED = 2;   // أخضر - صحيح

let state = [ACTIVE, LOCKED, LOCKED, LOCKED, LOCKED, LOCKED, LOCKED, LOCKED, LOCKED];
let current = 0;

// 🆕 9x9 Grid للـ puzzle cells
let puzzleCells = Array(9).fill().map(()=>Array(9).fill(""));

// 🆕 Block 0: 4 + ? = 9
puzzleCells[0][0][0] = "4";
puzzleCells[0][0][1] = "+";
puzzleCells[0][0][3] = "=";
puzzleCells[0][0][4] = "9";  // Answer

let floatingNumbers = [
    {value:"5", x:620, y:70, dragging:false, homeX:620, homeY:70},
    {value:"6", x:40, y:200, dragging:false, homeX:40, homeY:200},
    {value:"7", x:610, y:480, dragging:false, homeX:610, homeY:480},
    {value:"8", x:55, y:470, dragging:false, homeX:55, homeY:470},
    {value:"9", x:625, y:625, dragging:false, homeX:625, homeY:625}
];

let mouse = {x:0, y:0, down:false, draggingNum:null};

function setActive(i) {
    current = i;
    console.log(`🎮 Block ${i + 1} → ACTIVE`);
}

// 🆕 VALIDATION FUNCTION
function validateBlock(blockIdx) {
    // Check if 4 + 5 = 9
    let row0 = puzzleCells[blockIdx][0];
    if(row0[0] === "4" && row0[1] === "+" && row0[2] === "5" && row0[3] === "=" && row0[4] === "9") {
        state[blockIdx] = SOLVED;
        console.log(`✅ Block ${blockIdx + 1} SOLVED! 4+5=9 ✓`);
        if(blockIdx + 1 < 9) setActive(blockIdx + 1);
        return true;
    }
    return false;
}

// DRAW BLOCKS مع الحالات
function drawBlocks() {
    let offset = 60;
    let size = 190;
    
    let gradient = ctx.createRadialGradient(350, 350, 0, 350, 350, 400);
    gradient.addColorStop(0, '#020a1a');
    gradient.addColorStop(1, '#000');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 700, 700);
    
    for(let i = 0; i < 9; i++) {
        let x = (i % 3) * size + offset;
        let y = Math.floor(i / 3) * size + offset;
        let s = state[i];
        
        ctx.save();
        
        // 🔒 LOCKED (Gray)
        if(s === LOCKED) {
            ctx.shadowColor = '#666666';
            ctx.shadowBlur = 10;
            ctx.strokeStyle = '#666666';
            ctx.lineWidth = 2;
            ctx.fillStyle = 'rgba(40,40,40,0.8)';
        }
        // 🔵 ACTIVE (Blue)
        else if(s === ACTIVE) {
            ctx.shadowColor = '#00b8ff';
            ctx.shadowBlur = 30;
            ctx.strokeStyle = '#00d4ff';
            ctx.lineWidth = 6;
            ctx.fillStyle = 'rgba(0,40,90,0.85)';
        }
        // 🟢 SOLVED (Green)
        else if(s === SOLVED) {
            ctx.shadowColor = '#44ff88';
            ctx.shadowBlur = 25;
            ctx.strokeStyle = '#44ff88';
            ctx.lineWidth = 5;
            ctx.fillStyle = 'rgba(15,70,30,0.9)';
        }
        
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeRect(x, y, size, size);
        ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
        ctx.restore();
    }
}

// Draw puzzle content
function drawPuzzleContent() {
    let offset = 60;
    let size = 190;
    let cellSize = size / 3;
    
    for(let block = 0; block < 9; block++) {
        let bx = (block % 3) * size + offset;
        let by = Math.floor(block / 3) * size + offset;
        
        for(let row = 0; row < 1; row++) {  // Only row 0 for equation
            for(let col = 0; col < 5; col++) {  // 4 + 5 = 9
                let cx = bx + col * 38 + 20;
                let cy = by + cellSize / 2;
                let val = puzzleCells[block][row][col];
                
                if(val) {
                    ctx.save();
                    let color = /\d/.test(val) ? '#88ddff' : '#44ff88';
                    let shadow = /\d/.test(val) ? '#00aaff' : '#00ff44';
                    
                    ctx.shadowColor = shadow;
                    ctx.shadowBlur = state[block] === ACTIVE ? 18 : 12;
                    ctx.fillStyle = color;
                    ctx.font = 'bold 48px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                    ctx.strokeText(val, cx, cy);
                    ctx.fillText(val, cx, cy);
                    ctx.restore();
                }
            }
        }
    }
}

// Floating numbers
function drawFloatingNumbers() {
    floatingNumbers.forEach(num => {
        if(num.dragging) {
            num.x = mouse.x;
            num.y = mouse.y;
        } else {
            let t = Date.now() * 0.002 + parseInt(num.value);
            num.x = num.homeX + Math.sin(t) * 10;
            num.y = num.homeY + Math.cos(t * 1.3) * 10;
        }
        
        ctx.save();
        ctx.shadowColor = '#ffd700aa';
        ctx.shadowBlur = 28;
        ctx.fillStyle = '#ffd700';
        ctx.strokeStyle = '#b8860b';
        ctx.lineWidth = 5;
        ctx.font = 'bold 75px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeText(num.value, num.x, num.y);
        ctx.shadowBlur = 15;
        ctx.fillText(num.value, num.x, num.y);
        ctx.restore();
    });
}

// Mouse
canvas.addEventListener("mousedown", (e) => {
    mouse.down = true;
    mouse.x = e.offsetX;
    mouse.y = e.offsetY;
    
    // Only drag if block is ACTIVE
    if(state[current] === ACTIVE) {
        floatingNumbers.forEach(num => {
            if(Math.hypot(mouse.x - num.x, mouse.y - num.y) < 55) {
                num.dragging = true;
                mouse.draggingNum = num;
            }
        });
    }
});

canvas.addEventListener("mousemove", (e) => {
    mouse.x = e.offsetX;
    mouse.y = e.offsetY;
});

canvas.addEventListener("mouseup", (e) => {
    mouse.down = false;
    
    if(mouse.draggingNum && state[current] === ACTIVE) {
        let offset = 60, size = 190;
        let bx = (current % 3) * size + offset;
        let by = Math.floor(current / 3) * size + offset;
        
        // Drop in active block
        if(mouse.x > bx && mouse.x < bx + size && mouse.y > by && mouse.y < by + size) {
            // Place in first empty cell (position 2 for 5)
            if(puzzleCells[current][0][2] === "") {
                puzzleCells[current][0][2] = mouse.draggingNum.value;
                console.log(`📝 ${mouse.draggingNum.value} placed in Block ${current + 1}`);
                
                // Auto validate
                setTimeout(() => validateBlock(current), 500);
            }
        }
        mouse.draggingNum = null;
    }
    
    floatingNumbers.forEach(num => num.dragging = false);
});

// Keys
window.addEventListener("keydown", (e) => {
    if(e.key === "Enter") {
        if(validateBlock(current)) {
            console.log("🎉 Block validated!");
        }
    }
    if(e.key === " ") {
        puzzleCells[0][0][2] = "";  // Clear ?
        console.log("🔄 Reset");
    }
});

// LOOP
function loop() {
    ctx.clearRect(0, 0, 700, 700);
    
    drawBlocks();
    drawPuzzleContent();
    drawFloatingNumbers();
    
    // Status
    ctx.save();
    ctx.font = 'bold 26px monospace';
    ctx.fillStyle = '#88ddff';
    ctx.shadowColor = '#00d4ff60';
    ctx.shadowBlur = 10;
    ctx.textAlign = 'center';
    ctx.fillText(`Block ${current + 1}/9 | State: ${state[current] === 0 ? '🔒 LOCKED' : state[current] === 1 ? '🔵 ACTIVE' : '🟢 SOLVED'}`, 350, 670);
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = '#66bbff';
    ctx.fillText('Drag 5 → ? | Enter=Check | Space=Reset', 350, 690);
    ctx.restore();
    
    requestAnimationFrame(loop);
}

loop();

console.log("🔒 LOCKED=Gray | 🔵 ACTIVE=Blue | 🟢 SOLVED=Green");
console.log("🎮 Drag 5 to 4 + ? = 9 → Enter ✓");
</script>
</body>
</html>
